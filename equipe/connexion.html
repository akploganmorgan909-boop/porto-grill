<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espace équipe | Porto Grill</title>
  <!-- Page privée : on demande aux moteurs de recherche de ne pas la lister -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#16120f">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="equipe.css">
</head>

<body class="login-page">

  <main class="login">

    <!-- Colonne de marque -->
    <section class="login-brand" aria-hidden="true">
      <div class="embers"><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <div class="login-brand-inner">
        <span class="flame"></span>
        <p class="login-brand-name">Porto Grill</p>
        <p class="login-brand-tag">Espace équipe</p>
      </div>
    </section>

    <!-- Formulaire -->
    <section class="login-panel" aria-labelledby="titre-connexion">
      <div class="login-card">
        <h1 id="titre-connexion">Connexion</h1>
        <p class="login-intro">Réservé au personnel du restaurant. Utilisez l’adresse e-mail et le mot de passe donnés par le patron.</p>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" name="email" autocomplete="username" inputmode="email" required>
          </div>

          <div class="field">
            <label for="motdepasse">Mot de passe</label>
            <div class="password-wrap">
              <input type="password" id="motdepasse" name="motdepasse" autocomplete="current-password" required>
              <button type="button" class="password-toggle" id="voirMotDePasse" aria-pressed="false">Afficher</button>
            </div>
          </div>

          <p class="alert" id="message" role="alert" hidden></p>

          <button class="btn btn-primary btn-block" type="submit" id="boutonConnexion">Se connecter</button>
        </form>

        <p class="login-help">Mot de passe oublié ? Demandez au patron de le changer.</p>
        <a class="login-back" href="../index.html">Retour au site du restaurant</a>
      </div>
    </section>

  </main>

  <!-- Bibliothèque Supabase (version fixée) puis nos fichiers -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="commun.js"></script>
  <script src="connexion.js"></script>
</body>
</html>
